<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heyy_TGzinBloxOfcYt</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    /* FUNDO */
    .background {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(#ffffff20 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    header h1 {
      font-size: 2.4em;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    header p {
      opacity: 0.7;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    /* CARD */
    .card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #0b0b0b;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      border: 1px solid #ffffff15;
      box-shadow: 0 0 20px #000;
    }

    .card img {
      width: 110px;
      height: 110px;
      border-radius: 16px;
      object-fit: cover;
      filter: grayscale(100%);
    }

    .card a {
      color: #fff;
      text-decoration: none;
      font-size: 1.3em;
      font-weight: bold;
    }

    .card span {
      font-size: 2em;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 0.85em;
      opacity: 0.5;
    }

    @media (max-width: 600px) {
      .card {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <header>
    <h1>Heyy_TGzinBloxOfcYt</h1>
    <p>Canal de Roblox no YouTube</p>
  </header>

  <div class="container">

    <!-- INSCRITOS (MANUAL / SEGURO) -->
    <div class="card">
      <img src="youtube.png" alt="YouTube">
      <div>
        <span>Inscritos</span>
        <div style="opacity:.6;">Atualizado manualmente</div>
      </div>
    </div>

    <!-- YOUTUBE -->
    <div class="card">
      <img src="avatar.png" alt="Canal">
      <a href="https://www.youtube.com/@Hey_TGzinBloxYt" target="_blank">
        Entrar no meu canal do YouTube
      </a>
    </div>

    <!-- ROBLOX -->
    <div class="card">
      <img src="roblox.png" alt="Roblox">
      <a href="https://www.roblox.com/pt/users/10406903267/profile" target="_blank">
        Minha conta no Roblox
      </a>
    </div>

  </div>

  <footer>
    © 2026 • Heyy_TGzinBloxOfcYt
  </footer>

</body>
</html>
