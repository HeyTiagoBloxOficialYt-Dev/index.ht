<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heyy_TGzinBloxOfcYt</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: radial-gradient(circle at top, #1a1a1a 0%, #000 70%);
      color: #fff;
    }

    .background {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(#ffffff15 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 70px 20px 40px;
    }

    header h1 {
      font-size: 2.5em;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #ffffff33;
      margin-bottom: 10px;
    }

    header p {
      opacity: 0.7;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 22px;
      background: linear-gradient(145deg, #0e0e0e, #000);
      border-radius: 22px;
      padding: 26px;
      margin-bottom: 28px;
      box-shadow: inset 0 0 25px #ffffff12, 0 0 35px #000;
      border: 1px solid #ffffff10;
    }

    .card img {
      width: 120px;
      height: 120px;
      border-radius: 18px;
      object-fit: cover;
      filter: grayscale(100%) contrast(110%);
      box-shadow: 0 0 20px #ffffff22;
    }

    .title {
      font-size: 2em;
      font-weight: bold;
      text-shadow: 0 0 15px #ffffff44;
    }

    .subtitle {
      opacity: 0.6;
      margin-top: 5px;
    }

    .card a {
      font-size: 1.3em;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 35px;
      font-size: 0.85em;
      opacity: 0.5;
    }

    @media (max-width: 600px) {
      .card {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <header>
    <h1>Heyy_TGzinBloxOfcYt</h1>
    <p>Canal de Roblox no YouTube</p>
  </header>

  <div class="container">

    <!-- INSCRITOS (MANUAL / SEGURO) -->
    <div class="card">
      <img src="youtube.png" alt="YouTube">
      <div>
        <div class="title">1.234 inscritos</div>
        <div class="subtitle">No YouTube</div>
      </div>
    </div>

    <!-- CANAL YOUTUBE -->
    <div class="card">
      <img src="avatar.png" alt="Canal">
      <a href="https://www.youtube.com/@Hey_TGzinBloxYt" target="_blank">
        Entrar no meu canal do YouTube
      </a>
    </div>

    <!-- ROBLOX -->
    <div class="card">
      <img src="roblox.png" alt="Roblox">
      <a href="https://www.roblox.com/pt/users/10406903267/profile" target="_blank">
        Minha conta no Roblox
      </a>
    </div>

  </div>

  <footer>
    © 2026 • Heyy_TGzinBloxOfcYt
  </footer>

</body>
</html>
